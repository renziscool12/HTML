<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Forms</title>
</head>

<body>
    <h1>Customer Information Form</h1>
    <hr>
    <form action="#" method="get">
        <br><br>
        Username: <input type="text" name="username">
        <br><br>
        Password: <input type="password" name="password">
        <br><br>
        Gender: <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="not_specified"> Prefer not to say
        <br><br>
        <p>Courses:</p>
        <input type="checkbox" name="course" value="it">Information Technology
        <br>
        <input type="checkbox" name="course" value="cs">Computer Science
        <br>
        <input type="checkbox" name="course" value="cyber">Cybersecurity
        <br>
        <input type="checkbox" name="course" value="bis">Library and Information Science
        <br>
        <input type="checkbox" name="course" value="da">Digital Animation
        <br>
        <input type="checkbox" name="course" value="mm">Multimedia
        <br><br>
        <p>Please choose the month when you are available for the class: <select name="month">
                <option value="" selected disabled>-- Select a month --</option>
                <option value="jan">January</option>
                <option value="feb">February</option>
                <option value="mar">March</option>
                <option value="apr">April</option>
                <option value="may">May</option>
                <option value="jun">June</option>
                <option value="jul">July</option>
                <option value="aug">August</option>
                <option value="sep">September</option>
                <option value="oct">October</option>
                <option value="nov">November</option>
                <option value="dec">December</option>
            </select></p><br>
        <label for="user-msg">Write a message to let us know:</label>
        <br>
        <textarea id="user-msg" name="message" rows="6" cols="50" placeholder="Write down here. . ."
            wrap="soft"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>

</html>
